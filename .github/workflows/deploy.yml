name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

  deploy:
    name: 部署到 Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 密钥走 wrangler.jsonc 里的 Secrets Store 绑定（随版本快照走），
      # 因此 CI 不再需要持有任何 Supabase 密钥，只有 Cloudflare 凭据。
      # 不要在这里加 wrangler-action 的 secrets 块：那会写入 script 级密钥，
      # 与 store 绑定形成第二个来源，反而会互相干扰（详见 README 第 2 节）。
      - name: 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # --keep-vars 保住配置未声明的 vars
          command: deploy --keep-vars
